<!doctype html>
<!--
  Custom emscripten shell for the rRootage reference build.

  Replaces the stock template (emscripten logo, console textarea, unstyled
  controls). Passed to emcc via --shell-file, so `make` regenerates rr.html from
  this rather than overwriting hand edits.

  {{{ SCRIPT }}} below is substituted by emcc with the loader tag; it must be
  present or the link fails.

  Layout contract with screen.c: the canvas is sized entirely by CSS here, and
  syncCanvasToDisplay() reads that size back and matches the framebuffer to it
  (x devicePixelRatio, capped). Do not set width/height attributes on the canvas.

  Touch contract with touch.c: this file owns all touch handling and pushes the
  resulting state through Module._rr_set_touch(). All tuning lives in TOUCH
  below, so it can be adjusted and reloaded on a device without a wasm rebuild.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>rRootage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2305070c'/><circle cx='16' cy='16' r='6' fill='none' stroke='%2360f0ff' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%23ffcc44'/></svg>">
<style>
  :root {
    --bg:      #05070c;
    --fg:      #c8d4e4;
    --dim:     #5a6a80;
    --accent:  #60f0ff;
    --warn:    #ffcc44;
    --danger:  #ff5566;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;

    /* A drag is steering, never a text selection. The canvas already opted out,
       but the page around it did not, so a finger that started on the surface
       could sweep a selection across the legend, the buttons and the gate and
       turn them blue. Applied at the root, where everything inherits it; #diag
       opts back in so a log can still be copied off a phone. */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;         /* no long-press "copy / share" bubble */
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; display: grid; place-items: center; }

  /* 4:3 to match the game's own letterboxing, so GL never has to draw bars.
     dvh matters on mobile: 100vh includes the retractable address bar, so the
     frame would otherwise be taller than the visible viewport. */
  #frame {
    position: relative;
    aspect-ratio: 4 / 3;
    width:  min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    width:  min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    max-width: 1600px;
    max-height: 1200px;
  }

  /* Taller than 4:3: hand the whole viewport to the canvas. screenResized() sees
     the portrait framebuffer and gives the field its own 2:3 viewport across the
     full width, which is the entire point -- a 4:3 letterbox would leave the
     playfield at about a third of the screen height. */
  @media (max-aspect-ratio: 4/3) {
    #frame {
      aspect-ratio: auto;
      width: 100vw;  height: 100vh;
      width: 100vw;  height: 100dvh;
      max-width: none; max-height: none;
    }
  }

  /* Fullscreen: the frame covers the screen, and the canvas keeps 4:3 centred
     inside it. Sizing the *frame* to 100vw/100vh instead would override
     aspect-ratio and hand the canvas a non-4:3 box — the game's own viewport
     letterboxing would hide that, but only by drawing a second set of bars. */
  #frame:fullscreen,
  #frame:-webkit-full-screen {
    max-width: none; max-height: none;
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
    background: var(--bg);
  }
  #frame:fullscreen > canvas,
  #frame:-webkit-full-screen > canvas {
    width:  min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    border: 0;
    outline: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  /* ---- loading ---- */

  #loader {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center;
    gap: 1.25rem;
    background: var(--bg);
    transition: opacity .35s ease;
    z-index: 5;
  }
  #loader.done { opacity: 0; pointer-events: none; }

  /* Deliberately not uppercased: the game's own logo is "rRootage" with the
     leading lowercase r, and text-transform turns it into "RROOTAGE". */
  #wordmark {
    font-size: clamp(1.7rem, 5vw, 2.8rem);
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--fg);
    text-shadow: 0 0 18px rgba(96, 240, 255, .35);
  }
  #wordmark span { color: var(--accent); }

  #bar { width: min(280px, 60vw); height: 2px; background: rgba(200,212,228,.14); overflow: hidden; }
  #bar > i {
    display: block; height: 100%; width: 0%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    transition: width .2s ease;
  }
  #bar.indeterminate > i { width: 35%; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(285%); } }

  #status {
    font-size: .75rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); min-height: 1em;
  }
  #status.error { color: var(--danger); text-transform: none; letter-spacing: .04em; }

  /* ---- desktop chrome ---- */

  #hud {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: .6rem .8rem;
    font-size: .7rem; color: var(--dim);
    opacity: 0; transition: opacity .3s ease;
    pointer-events: none; z-index: 3;
  }
  #stage:hover #hud, #hud:focus-within { opacity: 1; }
  #hud kbd {
    display: inline-block; padding: .1em .4em; margin: 0 .1em;
    border: 1px solid rgba(200,212,228,.25); border-radius: 3px;
    color: var(--fg); font: inherit; font-size: .95em;
  }
  #keys { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #fs, #ptr {
    pointer-events: auto; flex: none;
    padding: .35em .8em; background: transparent;
    border: 1px solid rgba(200,212,228,.25); border-radius: 3px;
    color: var(--fg); font: inherit; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
  }
  #fs:hover, #ptr:hover { border-color: var(--accent); color: var(--accent); }
  #fs:focus-visible, #ptr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #fs[hidden] { display: none; }
  #ptr.on { border-color: var(--accent); color: var(--accent); background: rgba(96,240,255,.12); }

  /* ---- audio / focus gate ---- */

  #gate {
    position: absolute; inset: 0;
    display: grid; place-content: center; gap: .8rem; justify-items: center;
    background: rgba(5,7,12,.82);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    cursor: pointer; z-index: 4;
    touch-action: none;
  }
  #gate[hidden] { display: none; }
  #gate b {
    font-size: .8rem; font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent);
  }
  #gate b { display: grid; place-items: center; }

  /* ---- touch controls ---- */

  /* Hidden until a touch is actually seen (or the pointer is known-coarse), so
     desktop is never cluttered and hybrid laptops only get them if used.
     Lives inside #stage — which is already full-viewport — rather than being
     position:fixed itself. A fixed element creates its own stacking context, so
     it would paint above the whole #stage subtree no matter how high the
     loader's and gate's z-indexes were, and swallow their clicks. */
  #touch { position: absolute; inset: 0; z-index: 2; display: none; touch-action: none; }
  body.touch #touch { display: block; }
  /* Real touch devices lose the keyboard legend, but the desktop pointer-test
     mode keeps it so the toggle stays reachable. */
  body.touch:not(.ptrtest) #hud { display: none; }

  /* The entire screen is the drag surface -- no joystick, no fixed zone.
     Touch anywhere and the ship moves relative to where the thumb landed,
     which is why nothing needs to be drawn for it. */
  #dragsurface { position: absolute; inset: 0; touch-action: none; }

  .tbtn {
    position: absolute;
    display: grid; place-items: center;
    border: 1px solid rgba(200,212,228,.30);
    border-radius: 50%;
    background: rgba(200,212,228,.06);
    color: var(--fg);
    font: inherit; font-size: .62rem;
    letter-spacing: .12em; text-transform: uppercase;
    opacity: .45;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Inert, not hidden: the control stays where it is so its absence is not
     mistaken for a missing feature, and it still swallows the tap rather than
     letting it through to the drag surface and moving the ship. */
  .tbtn.off { opacity: .16; }

  .tbtn.on {
    opacity: 1;
    border-color: var(--accent);
    background: rgba(96,240,255,.20);
    color: var(--accent);
  }

  /* The only visible control. Sits in the dead space right of the playfield so
     it never covers the action. */
  #bBomb {
    width: 78px; height: 78px;
    right: calc(5% + env(safe-area-inset-right, 0px));
    bottom: calc(10% + env(safe-area-inset-bottom, 0px));
  }

  /* Pause is a utility rather than a game action, so it is smaller than the bomb
     and tucked into the top corner. In portrait the renderer keeps the HUD
     readout clear of this corner; in landscape the corner is letterbox anyway. */
  /* Utility controls: rounded rather than round, to tell them apart from the
     action button and to give the segmented labels a usable width. They sit to
     the right of everything the renderer draws in the top strip. */
  .tbtn.util {
    width: 40px; height: 44px;
    border-radius: 6px;
    top: calc(8px + env(safe-area-inset-top, 0px));
  }
  #bPause { right: calc(53px + env(safe-area-inset-right, 0px)); }
  #bMenu  { right: calc(8px  + env(safe-area-inset-right, 0px)); }

  /* Labels are drawn from the game's own glyph data, so the controls read as
     part of the game rather than as a web page on top of it. Fill and outline
     match drawBox: a half-transparent body with a solid 1px edge. */
  .tbtn svg, #gate svg { display: block; height: .62rem; width: auto; max-width: 86%; }
  #bBomb svg { height: .78rem; }
  #gate svg  { height: 1.5rem; }
  .tbtn svg rect, #gate svg rect {
    fill: currentColor; fill-opacity: .5;
    stroke: currentColor; stroke-width: 1; vector-effect: non-scaling-stroke;
  }

  /* In portrait the field runs the full width, so there is no dead space beside
     it — the button goes in the strip underneath instead, opposite the LEFT/BOMB
     readout which the renderer places on the left of that strip. */
  @media (max-aspect-ratio: 4/3) {
    #bBomb {
      width: 84px; height: 84px;
      right: calc(6% + env(safe-area-inset-right, 0px));
      bottom: calc(2% + env(safe-area-inset-bottom, 0px));
    }
  }

  /* ---- on-device diagnostics ---- */

  /* Readable on a phone without tethering to a Mac. Shown by ?diag=1, and
     automatically whenever something throws, because the failure we most need
     to see is the one that happens where there is no console. */
  #diag {
    position: fixed; left: 0; right: 0; top: 0;
    max-height: 55vh; overflow: auto; z-index: 7;
    margin: 0; padding: 10px 12px;
    background: rgba(5,7,12,.94); color: var(--accent);
    border-bottom: 1px solid var(--accent);
    font: 11px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;   /* so it can be copied out */
  }
  #diag[hidden] { display: none; }
  #diag b { color: var(--warn); font-weight: 600; }
  #diag .err { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    #loader, #bar > i, #hud, #stick, .tbtn { transition: none; }
    #bar.indeterminate > i { animation: none; width: 100%; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="canvas" tabindex="0" aria-label="rRootage game screen"></canvas>

    <div id="loader">
      <div id="wordmark">r<span>Rootage</span></div>
      <div id="bar" class="indeterminate"><i></i></div>
      <div id="status" role="status" aria-live="polite">Loading</div>
    </div>

    <div id="gate" hidden>
      <b id="gateLabel">Play</b>
    </div>

    <div id="hud">
      <div id="keys">
        <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> move
        &nbsp; <kbd>Z</kbd> shoot &nbsp; <kbd>X</kbd> bomb &nbsp; <kbd>P</kbd> / <kbd>Esc</kbd> pause
      </div>
      <button id="ptr" type="button" title="Drive the touch controls with the mouse">Touch test</button>
      <button id="fs" type="button">Fullscreen</button>
    </div>
  </div>

  <div id="touch" aria-hidden="true">
    <div id="dragsurface"></div>
    <div class="tbtn util" id="bPause" aria-label="Pause">Pause</div>
    <div class="tbtn util" id="bMenu" aria-label="Menu">Menu</div>
    <div class="tbtn" id="bBomb" aria-label="Bomb">Bomb</div>
  </div>
</div>

<pre id="diag" hidden></pre>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const frame  = document.getElementById('frame');
  const loader = document.getElementById('loader');
  const bar    = document.getElementById('bar');
  const fill   = bar.querySelector('i');
  const status = document.getElementById('status');
  const gate   = document.getElementById('gate');

  let failed = false;

  const setStatus = (text) => {
    if (failed) return;
    const m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text || '');
    if (m) {
      bar.classList.remove('indeterminate');
      fill.style.width = Math.min(100, (+m[1] / +m[2]) * 100) + '%';
    }
    if (!text) return;
    status.textContent = text.replace(/\s*\([^)]*\)\s*$/, '').replace(/\.\.\.$/, '');
  };

  const hideLoader = () => {
    fill.style.width = '100%';
    bar.classList.remove('indeterminate');
    loader.classList.add('done');
    setTimeout(() => { loader.hidden = true; }, 400);
  };

  const fail = (msg) => {
    failed = true;
    loader.hidden = false;
    loader.classList.remove('done');
    bar.style.display = 'none';
    status.className = 'error';
    status.textContent = msg;
  };

  let runtimeReady = false;

  window.Module = {
    canvas,
    setStatus,
    onRuntimeInitialized() { runtimeReady = true; },
    print:    (...a) => console.log(...a),
    printErr: (...a) => console.error(...a),
    totalDependencies: 0,
    monitorRunDependencies(left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      if (left) {
        setStatus('Preparing (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
      } else {
        setStatus('');
        hideLoader();
        gate.hidden = false;
      }
    }
  };

  setStatus('Downloading');

  /* ---------------- diagnostics ----------------
     The previous version of this reported a generic "Failed to start" and threw
     the actual message away, which is useless on a device with no console. */

  const diagEl = document.getElementById('diag');
  const errors = [];
  let drawCalls = 0, drawCallsPeak = 0, contextLost = false;
  let frameStats = () => null;

  /* Observe the context rather than asking for one. Calling getContext()
     ourselves before emscripten does hands it a context created with the wrong
     attributes -- which silently broke startup the first time this panel was
     added, leaving the canvas at its default 300x150. */
  let glRef = null;
  (() => {
    const proto = HTMLCanvasElement.prototype, orig = proto.getContext;
    proto.getContext = function (type, ...rest) {
      const ctx = orig.call(this, type, ...rest);
      if (!glRef && ctx && /webgl/i.test(type)) glRef = ctx;
      return ctx;
    };
  })();

  const env = () => {
    const c = canvas, r = c.getBoundingClientRect();
    const gl = glRef;
    let renderer = 'n/a', ver = gl ? 'pending' : 'not created yet', maxVp = 'n/a';
    if (gl) {
      ver = gl.getParameter(gl.VERSION);
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      const v = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
      if (v) maxVp = v[0] + 'x' + v[1];
    }
    /* Never *read* Module.HEAP8 / wasmMemory and friends. Emscripten defines them
       as getters that call abort() when the symbol was not exported, and abort()
       tears down the main loop. A try/catch is not protection: it swallows the
       throw, but the runtime is already dead by then, so the game silently stops
       while the panel cheerfully reports "n/a".

       That is precisely what ?diag=1 was doing -- the game rendered nothing at
       all with diagnostics on, which is the one situation where the numbers are
       being read. Inspect the property descriptor instead, which never invokes
       the getter, and only read through when it is a plain value. */
    let heap = 'n/a';
    const desc = window.Module && Object.getOwnPropertyDescriptor(Module, 'wasmMemory');
    if (desc && !desc.get && desc.value && desc.value.buffer) {
      heap = (desc.value.buffer.byteLength / 1048576).toFixed(1) + ' MB';
    }
    return [
      'ua        ' + navigator.userAgent,
      'viewport  ' + innerWidth + 'x' + innerHeight + '  dpr ' + devicePixelRatio,
      'canvas    css ' + Math.round(r.width) + 'x' + Math.round(r.height) +
        '   backing ' + c.width + 'x' + c.height,
      'fb cap    ' + (window.rrFbCap || 'default') + (contextLost ? '   <b>WEBGL CONTEXT LOST</b>' : ''),
      'webgl     ' + ver,
      'renderer  ' + renderer,
      'max vp    ' + maxVp,
      'wasm heap ' + heap,
      'draws/frm ' + drawCalls + '  peak ' + drawCallsPeak,
      (() => {
        const f = frameStats();
        if (!f) return 'frame     measuring';
        const pct = Math.round(f.cAvg / (1000 / 60) * 100);
        return 'frame     ' + f.dAvg.toFixed(1) + ' ms avg  ' + f.dMax.toFixed(1) +
                 ' worst   ' + Math.round(f.fps) + ' fps\n' +
               'cpu/frame ' + f.cAvg.toFixed(2) + ' ms avg  ' + f.cMax.toFixed(2) +
                 ' worst   ' + pct + '% of the 60Hz budget';
      })(),
      'audio     ' + audioPlays + ' play() calls' +
        (audioFails.length ? '   rejected: ' + audioFails.join(',') : '   no rejections'),
    ].join('\n');
  };

  let wantDiag = false;

  const showDiag = () => {
    diagEl.hidden = false;
    diagEl.innerHTML = '<b>rRootage diagnostics</b>\n' + env() +
      (errors.length ? '\n\n<span class="err">' + errors.slice(-6).join('\n') + '</span>' : '');
  };

  /* A non-fatal note must not blanket the playfield. Show the panel, then retire
     it; tapping it dismisses immediately. ?diag=1 pins it open. */
  let pinned = false, retire = 0;
  const note = (s) => {
    errors.push(s);
    wantDiag = false;
    showDiag();
    if (!pinned) {
      clearTimeout(retire);
      retire = setTimeout(() => { if (!pinned) diagEl.hidden = true; }, 6000);
    }
  };

  /* Only cover the screen for things that actually stop the game: a wasm abort,
     or any failure before the runtime came up. Once it is running, report and
     carry on -- an overlay over a playable game is worse than the fault it is
     describing. */
  const isFatal = (msg) => !runtimeReady || /Aborted\(|RuntimeError/.test(msg || '');

  window.addEventListener('error', (e) => {
    const where = e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '';
    const msg = e.message || '(no message)';
    note('ERROR ' + msg + where);
    if (e.error && e.error.stack) note(String(e.error.stack).split('\n').slice(0, 4).join('\n'));
    if (isFatal(msg)) fail(msg);
  });

  window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    const name = (r && r.name) || '';
    const msg  = (r && r.message) ? r.message : String(r);
    note('REJECTED ' + (name ? name + ': ' : '') + msg);
    // AbortError/NotAllowedError are what iOS throws for interrupted or
    // not-yet-permitted media playback. They cost you sound, not the game.
    if (/AbortError|NotAllowedError|NotSupportedError/.test(name)) return;
    if (isFatal(msg)) fail(msg);
  });

  /* Emscripten's SDL_mixer calls <audio>.play() without attaching a catch, so on
     iOS every rejection surfaced as an unhandled promise. Swallow them here and
     record the reason, so audio problems are visible without being fatal. */
  let audioPlays = 0, audioFails = [];
  (() => {
    const ME = HTMLMediaElement.prototype, orig = ME.play;
    if (!orig) return;
    ME.play = function (...a) {
      audioPlays++;
      let p;
      try { p = orig.apply(this, a); } catch (err) { audioFails.push(String(err && err.name)); return; }
      if (p && p.catch) p.catch((err) => {
        const n = (err && err.name) || 'Error';
        if (audioFails.length < 8) audioFails.push(n);
      });
      return p;
    };
  })();

  // WebKit drops WebGL contexts aggressively under memory pressure. The stock
  // emscripten shell alerted on this; that was lost in the rewrite, so a lost
  // context looked like an unexplained freeze.
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    contextLost = true;
    note('WEBGL CONTEXT LOST — usually GPU memory pressure. Try a smaller ?fb=N');
  });
  canvas.addEventListener('webglcontextrestored', () => note('webgl context restored'));

  // Count draw calls per frame: the retained-mode batcher issues one
  // glDrawArrays per primitive from client-side arrays, which WebKit copies into
  // a temp buffer each time. If this number is in the hundreds it is the leading
  // suspect for the crash-after-a-few-seconds.
  (() => {
    const protos = [window.WebGLRenderingContext, window.WebGL2RenderingContext].filter(Boolean);
    let n = 0;
    for (const P of protos) {
      const orig = P.prototype.drawArrays;
      if (!orig) continue;
      P.prototype.drawArrays = function (...a) { n++; return orig.apply(this, a); };
    }

    /*
     * Frame timing. Two numbers, because they answer different questions.
     *
     * The rAF interval is pinned to vsync: it reads 16.7ms whatever the game is
     * doing, right up until frames actually start being missed. So it says
     * whether the cadence is being met, and nothing about how close to the edge
     * it is.
     *
     * The time spent inside the frame callbacks is the one that moves while the
     * game is still comfortable, so it is what shows headroom -- and the only
     * one that can tell whether a rendering change helped on a device that was
     * hitting 60 either way.
     *
     * The panel's own refresh is deliberately excluded: it rebuilds a fair chunk
     * of HTML, which on a phone can cost more than the frame being measured.
     * It is scheduled through the unwrapped rAF so it is never counted, and
     * throttled below so it is rarely even run.
     */
    const rafRaw = window.requestAnimationFrame.bind(window);
    let cpuAccum = 0;
    window.requestAnimationFrame = (cb) => rafRaw((t) => {
      const s = performance.now();
      try { return cb(t); } finally { cpuAccum += performance.now() - s; }
    });

    const N = 120;                      /* ~2s at 60Hz */
    const dts = new Float32Array(N), cpus = new Float32Array(N);
    let idx = 0, filled = 0, last = performance.now(), shownAt = 0;

    frameStats = () => {
      if (!filled) return null;
      let dSum = 0, dMax = 0, cSum = 0, cMax = 0;
      for (let i = 0; i < filled; i++) {
        const d = dts[i], c = cpus[i];
        dSum += d; if (d > dMax) dMax = d;
        cSum += c; if (c > cMax) cMax = c;
      }
      const dAvg = dSum / filled;
      return { dAvg, dMax, cAvg: cSum / filled, cMax, fps: dAvg > 0 ? 1000 / dAvg : 0 };
    };

    const tick = () => {
      drawCalls = n; if (n > drawCallsPeak) drawCallsPeak = n; n = 0;

      const now = performance.now();
      dts[idx] = now - last; cpus[idx] = cpuAccum;
      idx = (idx + 1) % N; if (filled < N) filled++;
      last = now; cpuAccum = 0;

      // Reveal on the first frame after the runtime is live, never before: the
      // panel used to be shown at parse time, which aborted startup inside
      // initSDL before SDL_SetVideoMode ever ran.
      if (wantDiag && runtimeReady) { wantDiag = false; diagEl.hidden = false; }
      if (!diagEl.hidden && now - shownAt > 250) { shownAt = now; showDiag(); }
      rafRaw(tick);
    };
    rafRaw(tick);
  })();

  const params = new URLSearchParams(location.search);
  if (params.has('fb')) window.rrFbCap = parseInt(params.get('fb'), 10) || 0;
  if (params.has('diag')) { wantDiag = true; pinned = true; }  // revealed by the frame ticker
  diagEl.addEventListener('pointerdown', (e) => { diagEl.hidden = true; pinned = false; e.stopPropagation(); });

  const dismissGate = () => { gate.hidden = true; canvas.focus(); };
  gate.addEventListener('click', dismissGate);
  gate.addEventListener('keydown', dismissGate);
  window.addEventListener('keydown', () => { if (!gate.hidden) dismissGate(); }, { once: true });

  // Fullscreen is unavailable for arbitrary elements on iPhone Safari, so hide
  // the control rather than leaving one that silently does nothing.
  const fsBtn = document.getElementById('fs');
  if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
    fsBtn.hidden = true;
  }
  fsBtn.addEventListener('click', () => {
    // Fullscreen the frame, not the canvas: the canvas is CSS-sized to 100% of
    // it, so the aspect ratio survives and screen.c re-syncs on the change event.
    // Emscripten's own Module.requestFullscreen is bypassed deliberately — it
    // rewrites canvas.width/height and fights syncCanvasToDisplay().
    if (document.fullscreenElement) document.exitFullscreen();
    else frame.requestFullscreen?.().catch(() => {});
    canvas.focus();
  });

  canvas.addEventListener('mousedown', () => canvas.focus());
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, { passive: false });

  /* ------------------------------------------------------------------ *
   * Touch input
   *
   * No joystick and no fixed zone: the whole screen is the surface. The ship
   * moves in the direction of the finger's offset from wherever it first
   * landed, so the thumb is never required to sit on the ship (fatal in a
   * bullet hell -- the thing you must see would be underneath it).
   *
   * Drag distance sets SPEED, not just direction. The vector's magnitude is
   * pushed through as 128..256 in 8.8, and ship.c multiplies it by ship.speed,
   * giving roughly the same 500..1000 range the fire button used to toggle
   * between. That is what replaces the focus-slow, which autofire would
   * otherwise hold on permanently.
   *
   * Fire is automatic while a finger is down. touch.c gates it on IN_GAME so
   * that touching to navigate a menu doesn't instantly select an entry; menus
   * get the short `tap` pulse instead.
   * ------------------------------------------------------------------ */

  /* Positional steering. The ship follows the thumb's accumulated travel and
     stops when the thumb stops, which is what allows tight moves between
     bullets. The previous velocity model (hold an offset, keep moving) always
     overshot, because stopping meant returning the finger to an invisible
     origin. */
  const TOUCH = {
    gain:     1.0,  // 1.0 = the ship travels exactly as far as the thumb does
    tapMs:    250,  // press shorter than this, and...
    tapPx:    12,   // ...moved less than this, counts as a tap
    tapHold:  140,  // ms to hold a synthesized press, so the 62Hz sim sees it
    dirPx:    10,   // offset before a menu direction is reported
  };

  // The field is 320x480 field units across, stored in 8.8, so it is (320<<8) =
  // 81920 units wide. Both axes work out to the same scale, so one factor
  // converts CSS pixels to field units: 81920 / fieldWidthInCssPx.
  //
  // How wide the field is on screen depends on the orientation -- in landscape it
  // is the masked centre half of a 4:3 viewport, in portrait it is the whole
  // viewport -- so the renderer is asked rather than assumed. Halving or doubling
  // this silently doubles or halves how far the ship travels per finger travel.
  const FIELD_UNITS_WIDE = 81920;
  const fieldPerPx = () => {
    const cssW = canvas.getBoundingClientRect().width;
    if (!(cssW > 0) || !canvas.width) return 0;
    let fieldFbPx = 0;
    try { fieldFbPx = runtimeReady ? Module._rr_field_px_width() : 0; } catch (e) {}
    // Before the first frame, fall back to the landscape assumption.
    if (!(fieldFbPx > 0)) fieldFbPx = canvas.width / 2;
    const fieldCssPx = fieldFbPx * (cssW / canvas.width);
    return fieldCssPx > 0 ? FIELD_UNITS_WIDE / fieldCssPx : 0;
  };

  const surface = document.getElementById('dragsurface');
  const drag = { id: null, lx: 0, ly: 0, accX: 0, accY: 0,
                 dx: 0, dy: 0, t0: 0, moved: 0 };
  const btn = { bomb: false };
  let menuUntil = 0;
  let tapUntil = 0, pauseUntil = 0;

  const push = () => {
    /* Gate on the runtime actually being up, NOT on the export existing.
       Emscripten installs an asserting stub for every exported function before
       initialization, so `Module._rr_set_touch` is already truthy and calling it
       aborts the whole runtime with "native function called before runtime
       initialization". On iOS (pointer: coarse) matches, so the touch surface is
       live while the 3.7 MB payload is still loading and the first tap -- the one
       on "Tap to play" -- killed startup. Desktop never saw it because the touch
       UI is only enabled manually there, after load. */
    if (!runtimeReady) return;
    const fn = window.Module && window.Module._rr_set_touch;
    if (typeof fn !== 'function') return;
    const now = Date.now();
    let dirX = 0, dirY = 0;
    if (drag.id !== null) {
      // Direction of the current offset, for menu navigation only.
      const m = Math.hypot(drag.dx, drag.dy);
      if (m > TOUCH.dirPx) {
        dirX = Math.round(drag.dx / m * 256);
        dirY = Math.round(drag.dy / m * 256);
      }
    }
    fn(Math.round(drag.accX), Math.round(drag.accY), dirX, dirY,
       drag.id !== null ? 1 : 0,
       now < tapUntil   ? 1 : 0,
       btn.bomb         ? 1 : 0,
       now < pauseUntil ? 1 : 0,
       now < menuUntil  ? 1 : 0);
  };

  // Held rather than instantaneous: rr.c toggles pause on the press edge and
  // polls once per 16ms sim step, so a zero-length pulse could fall between two
  // steps and be missed entirely.
  const pulsePause = () => {
    if (Date.now() < pauseUntil) return;
    pauseUntil = Date.now() + TOUCH.tapHold;
    push();
    setTimeout(push, TOUCH.tapHold + 20);
  };
  const pulseMenu = () => {
    if (Date.now() < menuUntil) return;
    menuUntil = Date.now() + TOUCH.tapHold;
    push();
    setTimeout(push, TOUCH.tapHold + 20);
  };

  const enableTouchUI = () => {
    if (!document.body.classList.contains('touch')) document.body.classList.add('touch');
  };
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) enableTouchUI();

  surface.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    enableTouchUI();
    if (drag.id !== null) { e.preventDefault(); return; }
    drag.id = e.pointerId;
    drag.lx = e.clientX; drag.ly = e.clientY;
    drag.accX = drag.accY = 0;
    drag.dx = drag.dy = 0;
    drag.t0 = Date.now();
    drag.moved = 0;
    try { surface.setPointerCapture(e.pointerId); } catch (_) {}
    push();
    e.preventDefault();
  });

  surface.addEventListener('pointermove', (e) => {
    if (e.pointerId !== drag.id) return;
    const k = fieldPerPx() * TOUCH.gain;
    // Integrate movement rather than measuring offset from a fixed origin, so
    // there is no origin to return to and no drift when the finger is lifted.
    drag.accX += (e.clientX - drag.lx) * k;
    drag.accY += (e.clientY - drag.ly) * k;
    drag.dx += e.clientX - drag.lx;
    drag.dy += e.clientY - drag.ly;
    drag.lx = e.clientX; drag.ly = e.clientY;
    drag.moved = Math.max(drag.moved, Math.hypot(drag.dx, drag.dy));
    push();
    e.preventDefault();
  });

  const endDrag = (e) => {
    if (e.pointerId !== drag.id) return;
    // A short, still press is a tap: pulse BUTTON1 so menus can be operated.
    // In play this is redundant (autofire already holds BUTTON1) and harmless.
    if (Date.now() - drag.t0 < TOUCH.tapMs && drag.moved < TOUCH.tapPx) {
      tapUntil = Date.now() + TOUCH.tapHold;
      setTimeout(push, TOUCH.tapHold + 20);
    }
    drag.id = null;
    push();
  };
  surface.addEventListener('pointerup', endDrag);
  surface.addEventListener('pointercancel', endDrag);
  // A context menu over the playfield is never wanted while the surface is live.
  surface.addEventListener('contextmenu', (e) => e.preventDefault());

  /* Pause. A momentary pulse rather than a held button, so the lit state is on a
     timer purely as feedback that the tap registered. */
  const pauseEl = document.getElementById('bPause');
  pauseEl.addEventListener('pointerdown', (e) => {
    enableTouchUI();
    pulsePause();
    // The sim toggles pause a frame or two later, so look again once it has.
    setTimeout(syncPaused, TOUCH.tapHold + 40);
    pauseEl.classList.add('on');
    setTimeout(() => pauseEl.classList.remove('on'), TOUCH.tapHold);
    e.preventDefault();
    e.stopPropagation();               // must not also start a drag
  });

  const bombEl = document.getElementById('bBomb');
  const bombDown = (e) => {
    enableTouchUI();
    btn.bomb = true;
    bombEl.classList.add('on');
    try { bombEl.setPointerCapture(e.pointerId); } catch (_) {}
    push();
    e.preventDefault();
    e.stopPropagation();               // must not also start a drag or count as finger 2
  };
  const bombUp = (e) => {
    btn.bomb = false;
    bombEl.classList.remove('on');
    push();
    e.preventDefault();
    e.stopPropagation();
  };
  /* Labels in the game's own segmented letterforms.
     The glyph data comes from the module (rr_glyph) rather than being copied
     here, and the geometry mirrors drawLetter(): one rect per segment, centred
     on (x, -y) * size, with half-extents from the segment's size and length,
     swapped when it stands upright. A letter spans 0.83 either side of its
     origin and 1.33 above and below it; the pen advances 1.7 per character. */
  const GLYPH_ADV = 1.7, GLYPH_HW = 0.83, GLYPH_HH = 1.33;
  const glyphIndex = (c) => {
    if (c >= '0' && c <= '9') return c.charCodeAt(0) - 48;
    if (c >= 'a' && c <= 'z') return c.charCodeAt(0) - 87;   // folded to caps
    if (c >= 'A' && c <= 'Z') return c.charCodeAt(0) - 55;
    if (c === '.') return 36;
    if (c === '-') return 38;
    if (c === '+') return 39;
    return 37;
  };
  const segLabel = (el, text) => {
    if (!runtimeReady || !el) return false;
    let g;
    try { g = Module._rr_glyph; } catch (e) { return false; }
    if (typeof g !== 'function') return false;
    const r = [];
    for (let i = 0; i < text.length; i++) {
      if (text[i] === ' ') continue;
      const gi = glyphIndex(text[i]), ox = i * GLYPH_ADV;
      for (let sg = 0; sg < 16; sg++) {
        const deg = g(gi, sg, 4);
        if (deg > 99990) break;
        const x = g(gi, sg, 0), y = -g(gi, sg, 1);
        const size = g(gi, sg, 2) * 0.66, len = g(gi, sg, 3) * 0.6;
        const d = ((deg % 180) + 180) % 180;
        const upright = !(d <= 45 || d > 135);
        const hw = upright ? len : size, hh = upright ? size : len;
        r.push('<rect x="' + (ox + x - hw).toFixed(3) + '" y="' + (y - hh).toFixed(3) +
               '" width="' + (2 * hw).toFixed(3) + '" height="' + (2 * hh).toFixed(3) + '"/>');
      }
    }
    const w = (text.length - 1) * GLYPH_ADV + 2 * GLYPH_HW;
    el.innerHTML = '<svg viewBox="' + (-GLYPH_HW).toFixed(3) + ' ' + (-GLYPH_HH).toFixed(3) +
      ' ' + w.toFixed(3) + ' ' + (2 * GLYPH_HH).toFixed(3) +
      '" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + r.join('') + '</svg>';
    return true;
  };

  /* BUTTON2 is a bomb only in Normal mode: Psy rolls, Ika flips the ship's
     polarity and GW releases the reflect force, so the label follows the mode.
     Polled rather than pushed because it only ever changes at the title. */
  const BTN2_LABEL = ['Bomb', 'Roll', 'Shift', 'Reflect'];
  let btn2Label = null, staticLabels = false;
  const syncLabels = () => {
    if (!runtimeReady) return;
    if (!staticLabels) {
      staticLabels = segLabel(pauseEl, 'Pause') &&
                     segLabel(document.getElementById('bMenu'), 'Menu') &&
                     segLabel(document.getElementById('gateLabel'), 'Play');
    }
    let m;
    try { m = Module._rr_mode(); } catch (e) { return; }
    const t = BTN2_LABEL[m] || BTN2_LABEL[0];
    if (t !== btn2Label && segLabel(bombEl, t)) btn2Label = t;
  };
  setInterval(() => { syncLabels(); syncPaused(); }, 250);

  /* Menu abandons the run, so it is only live while the game is paused: pause
     first, then quit. That makes it two deliberate taps instead of one stray one
     during play. C enforces the same rule; this only reflects it. */
  const menuEl = document.getElementById('bMenu');
  let paused = false;
  const syncPaused = () => {
    let p = false;
    try { p = runtimeReady && !!Module._rr_paused(); } catch (e) { p = false; }
    if (p === paused) return;
    paused = p;
    menuEl.classList.toggle('off', !p);
  };
  menuEl.classList.add('off');

  menuEl.addEventListener('pointerdown', (e) => {
    enableTouchUI();
    // Swallowed either way, so a tap on a dead button never starts a drag.
    e.preventDefault();
    e.stopPropagation();
    if (!paused) return;
    pulseMenu();
    menuEl.classList.add('on');
    setTimeout(() => menuEl.classList.remove('on'), TOUCH.tapHold);
  });

  bombEl.addEventListener('pointerdown', bombDown);
  bombEl.addEventListener('pointerup', bombUp);
  bombEl.addEventListener('pointercancel', bombUp);

  window.addEventListener('touchstart', enableTouchUI, { once: true, passive: true });

  /* Desktop pointer-test mode: drive the touch controls with the mouse, so the
     scheme can be exercised without a phone. Pointer Events already deliver
     mouse input to the handlers above; this only reveals the UI and swaps the
     legend. Enable with the toolbar button or ?touch=1. */
  const ptrBtn = document.getElementById('ptr');
  const keysEl = document.getElementById('keys');
  const keysHtml = keysEl.innerHTML;
  const setPtrTest = (on) => {
    document.body.classList.toggle('ptrtest', on);
    document.body.classList.toggle('touch', on || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches));
    ptrBtn.classList.toggle('on', on);
    keysEl.innerHTML = on
      ? 'drag anywhere to move &nbsp;·&nbsp; autofire &nbsp;·&nbsp; pause button, top right'
      : keysHtml;
    if (!on) releaseAll();
  };
  ptrBtn.addEventListener('click', () => setPtrTest(!document.body.classList.contains('ptrtest')));
  if (new URLSearchParams(location.search).has('touch')) setPtrTest(true);

  // Safety: if the page loses focus mid-hold, C would keep seeing input
  // forever -- and with autofire that also means a permanently held trigger.
  const releaseAll = () => {
    drag.id = null;
    drag.accX = drag.accY = drag.dx = drag.dy = 0;
    btn.bomb = false;
    tapUntil = pauseUntil = menuUntil = 0;
    bombEl.classList.remove('on');
    pauseEl.classList.remove('on');
    menuEl.classList.remove('on');
    push();
  };
  /* CSS covers this, but Safari will still start a selection in some cases, and
     desktop browsers treat a drag as a potential drag-and-drop. Cancelling both
     outside the diagnostics panel keeps a stray drag from painting the UI blue. */
  const inDiag = (e) => !!(e.target && e.target.closest && e.target.closest('#diag'));
  document.addEventListener('selectstart', (e) => { if (!inDiag(e)) e.preventDefault(); });
  document.addEventListener('dragstart',   (e) => { if (!inDiag(e)) e.preventDefault(); });

  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
})();
</script>
